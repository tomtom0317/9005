function $(id){return document.getElementById(id)}
function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE)||"null");if(s){stage=s.stage||0;score=s.score||0;cleared=s.cleared||0}}catch(e){}if(stage<0||stage>=PREFS.length)stage=0}

function renderMap(){var html="",i,cl;for(i=0;i<PREFS.length;i++){cl="mcell ";if(i<stage)cl+="done ";if(i===stage)cl+="now ";if(i===12||i===25||i===26||i===46)cl+="boss ";html+='<div class="'+cl+'">'+(i+1)+'</div>'}$("map").innerHTML=html}
function render(){var pct=Math.max(0,Math.round(enemyHp/enemyMaxHp*100));$("stageNo").innerHTML=(stage+1)+"/47";$("score").innerHTML=String(score);$("combo").innerHTML=String(combo);$("cleared").innerHTML=String(cleared);$("enemyName").innerHTML=(stage===46?"👑 ":"")+"第"+(stage+1)+"の城 主";$("hpBar").style.width=pct+"%";$("hpBar").style.background=pct>50?"#22c55e":(pct>25?"#eab308":"#ef4444");$("hpText").innerHTML="HP "+Math.max(0,enemyHp)+" / "+enemyMaxHp;renderMap();drawSamurai();$("bgm").innerHTML=bgmOn?"🎵 BGM ON":"🎵 BGM OFF";$("bgm").className=bgmOn?"small on":"small";$("sound").innerHTML=soundOn?"🔊 SE ON":"🔇 SE OFF"}
function startStage(i){stage=i;enemyMaxHp=(i%10===9?100:(i===46?150:60));enemyHp=enemyMaxHp;combo=0;$("stageClear").style.display="none";render();newQuestion();save()}
function newQuestion(){
 locked=false;current=PREFS[stage];
 var mode=Math.floor(Math.random()*3),prompt="",sub="";
 if(mode===0){$("mode").innerHTML="① よみかたから えらぼう";prompt=current.kana;sub="この なまえの 都道府県(とどうふけん)は？";correct=current.name}
 else if(mode===1){$("mode").innerHTML="② かんじを よもう";prompt=current.name;sub="ただしい よみかたは どれ？";correct=current.kana}
 else{$("mode").innerHTML="③ ちほうを おぼえよう";prompt=current.name;sub="この 都道府県(とどうふけん)は どの ちほう？";correct=current.region}
 $("question").innerHTML=prompt;$("kana").innerHTML=sub;makeChoices(mode);questionStart=(new Date()).getTime();if(timer)clearInterval(timer);timer=setInterval(updateTimer,80);updateTimer();
}
function makeChoices(mode){
 var vals=[correct],pool=[],i,j,t,v;
 if(mode===0){for(i=0;i<PREFS.length;i++)if(PREFS[i].name!==correct)pool.push(PREFS[i].name)}
 else if(mode===1){for(i=0;i<PREFS.length;i++)if(PREFS[i].kana!==correct)pool.push(PREFS[i].kana)}
 else pool=["北海道","東北","関東","中部","近畿","中国","四国","九州・沖縄"];
 while(vals.length<4){v=pool[Math.floor(Math.random()*pool.length)];if(vals.indexOf(v)<0)vals.push(v)}
 for(i=vals.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=vals[i];vals[i]=vals[j];vals[j]=t}
 var html="";for(i=0;i<4;i++)html+='<div class="answerCell"><button class="answer" data-v="'+vals[i]+'">'+vals[i]+'</button></div>';$("answers").innerHTML=html;

}

 if(locked)return;locked=true;if(timer)clearInterval(timer);var sec=((new Date()).getTime()-questionStart)/1000,bs=document.getElementsByClassName("answer"),i;for(i=0;i<bs.length;i++)bs[i].disabled=true;
 if(v===correct){var d=damage(sec)+Math.min(10,combo*2);combo++;enemyHp-=d;score+=d*10;btn.style.background="#2e7d32";$("msg").innerHTML="⭕ せいかい！ "+sec.toFixed(1)+"びょう！<br>⚔️ "+d+" ダメージ！";showDamage("-"+d);playHit(d);render();if(enemyHp<=0)setTimeout(clearStage,650);else setTimeout(newQuestion,800)}

 px(c,26,11,28,18,armor);px(c,19,18,42,9,armor);px(c,31,7,18,7,gold);if(boss){px(c,20,4,6,12,gold);px(c,54,4,6,12,gold)}

/* audio */
function getAudio(){if(audioCtx)return audioCtx;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{audioCtx=new AC()}catch(e){audioCtx=null}return audioCtx}
function unlockAudio(){var a=getAudio();if(!a)return;try{if(a.state==="suspended"&&a.resume)a.resume();var b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}

function bgmTick(){var a=getAudio(),m=[220,261.63,293.66,329.63,293.66,261.63,246.94,220,196,246.94,293.66,392,329.63,293.66,261.63,246.94],b=[110,110,123.47,123.47,146.83,146.83,123.47,123.47],now;if(!a||!bgmOn)return;now=a.currentTime+.03;tone(m[bgmStep%m.length],now,.18,.018,"square");if(bgmStep%2===0)tone(b[Math.floor(bgmStep/2)%b.length],now,.32,.011,"triangle");bgmStep++}
function startBgm(){unlockAudio();bgmOn=true;if(bgmTimer)clearInterval(bgmTimer);bgmStep=0;bgmTick();bgmTimer=setInterval(bgmTick,270);render()}
function stopBgm(){bgmOn=false;if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}render()}
function toggleBgm(){if(bgmOn)stopBgm();else startBgm()}
function fireworks(n){var fx=$("fx"),cx=window.innerWidth/2,cy=window.innerHeight*.24,C=["#f66","#fd4","#5b7","#48e","#a6e"],i,e;for(i=0;i<n;i++){e=document.createElement("div");e.className="spark";e.style.background=C[i%5];e.style.left=cx+"px";e.style.top=cy+"px";fx.appendChild(e);(function(el,dx,dy,born){var tm=setInterval(function(){var t=((new Date()).getTime()-born)/900;if(t>=1){clearInterval(tm);if(el.parentNode)el.parentNode.removeChild(el);return}el.style.left=(cx+dx*t)+"px";el.style.top=(cy+dy*t)+"px";el.style.opacity=String(1-t)},30)})(e,Math.random()*600-300,80+Math.random()*400,(new Date()).getTime())}}

$("nextStage").onclick=nextStage;$("again").onclick=function(){stage=0;score=0;cleared=0;$("allClear").style.display="none";startStage(0)};
$("restart").onclick=function(){unlockAudio();if(confirm("さいしょから やりなおしますか？")){stage=0;score=0;cleared=0;startStage(0)}};
$("sound").onclick=function(){unlockAudio();soundOn=!soundOn;render()};$("bgm").onclick=function(){unlockAudio();toggleBgm()};
load();startStage(stage);
})();
</script>
